# Rhema Studio Companion (#209): the small app for a computer that runs OBS only. It finds the church's
# Rhema, pairs with it (its certificate pinned), and adds the church's cameras to this computer's
# OBS. No speech, Bible, NDI, models or content database: it builds without models/ or data/.
[package]
name = "rhema-companion"
# The app is 1.1.0.0 (A.B.C.D); Cargo and Tauri take three parts.
version = "1.1.0"
description = "Rhema Studio Companion - the church's cameras in OBS on a second computer"
authors = ["Faithful"]
license = "MIT"
repository = "https://github.com/openbezal/rhema"
edition = "2021"
rust-version = "1.77.2"

# Its own workspace: built on its own, never with the studio app.
[workspace]

[lib]
name = "rhema_companion_lib"
crate-type = ["rlib"]

[[bin]]
# "Rhema Studio Companion.exe" / "Rhema Studio Companion.app" (tauri.conf.json mainBinaryName); Cargo names have no spaces.
name = "rhema-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
# 2.5: the last one for Tauri 2.11, the version the studio app and @tauri-apps/api use.
tauri-plugin-autostart = "~2.5.1"
rhema-join = { path = "../../src-tauri/crates/join", features = ["pinned", "keychain"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
# Small: one codegen unit, link-time optimisation, no debug symbols.
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
