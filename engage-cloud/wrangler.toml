name = "rhema-engage"
main = "src/index.mjs"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "QuizRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "QuizDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuizRoom", "QuizDirectory"]

# Set secrets with: npx wrangler secret put ADMIN_KEY, SESSION_SIGNING_KEY, TURNSTILE_SITE_KEY, and TURNSTILE_SECRET.
# No deployment occurs merely by building the desktop application.

# On your own domain, under a path (e.g. https://example.com/quiz): uncomment both, with your
# domain (its DNS on Cloudflare), then `npx wrangler deploy`. Rhema Studio's quiz address is then
# https://example.com/quiz, and the Turnstile widget must list example.com.
# routes = [{ pattern = "example.com/quiz*", zone_name = "example.com" }]
# [vars]
# BASE_PATH = "/quiz"
