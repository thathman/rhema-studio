name: Rhema Studio website — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-rhema-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-rhema-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone site and GitHub Pages links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.local = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag in ('a','link','script','img'):
                      value = d.get('href') or d.get('src')
                      if value and value.startswith('./'):
                          self.local.append(value)
          root = Path("site")
          html = (root / "index.html").read_text(encoding="utf-8")
          assert "Rhema Studio" in html
          assert "openrhema.com" not in html
          assert "thathman.github.io/rhema-studio/" in html
          assert not (root / "CNAME").exists(), "No inherited custom domain"
          links = Links()
          links.feed(html)
          for link in links.local:
              assert (root / link.removeprefix("./")).is_file(), link
          assert "openrhema.com" not in (root / "script.js").read_text(encoding="utf-8")
          print("Site links, ownership and files validated.")
          PY
      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: github-pages
      url: https://thathman.github.io/rhema-studio/
    steps:
      - name: Publish to the repository's GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
