name: Recorder on Windows

# Real encodes through Media Foundation, read back by Windows: no installer is built (those stay
# manual in build-windows-installer.yml).
on:
  pull_request:
    paths:
      - src-tauri/crates/recorder/**
      - .github/workflows/recorder-windows.yml
  push:
    branches:
      - claude/c1-windows-recorder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encode:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Media Foundation (a server option on this image)
        shell: pwsh
        run: Install-WindowsFeature Server-Media-Foundation
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
      - name: Recorder tests
        working-directory: src-tauri
        run: cargo test -p rhema-recorder -- --nocapture
