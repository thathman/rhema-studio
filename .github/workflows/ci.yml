name: CI

# Runs on every pull request and on pushes to main. Release
# packaging stays in build-release.yml (tags) and build-windows-installer.yml
# (manual); this workflow never produces artifacts and never signs anything.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (tsc -b; the root tsconfig has no files, so plain `tsc --noEmit` checks nothing)
        run: bunx tsc -b --noEmit
      - name: Unit tests
        run: bunx vitest run
      - name: Dependency licences (npm production tree)
        run: bun scripts/check-licenses.ts --js
      - name: Production build (Vite; typecheck passed above)
        run: bun run vite build
      - name: Rhema Studio Companion page build (its own Vite entry, #209; typecheck passed above)
        run: bun run vite build --config companion-app/vite.config.ts

  lint:
    # The whole repository lints clean (ST-010); any new error fails the job.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: ESLint (whole repo, blocking; the upstream debt was paid down in ST-010)
        run: bunx eslint .

  rust:
    name: Rust (content tests, app check, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The packages this job installs, kept between runs (#604 follow-up): the runner's mirror has
      # trickled one package for minutes at a time and timed the step out (4 Nov, runs 41860147604,
      # 41882278283 and 41898262614). apt still checks every kept file against the signed index and fetches what is
      # missing or changed, so nothing is trusted that was not before; only the download is saved.
      - name: Runner image (the kept packages are per image)
        id: image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore kept apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ steps.image.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-${{ github.job }}-${{ steps.image.outputs.version }}-
            apt-${{ github.job }}-${{ steps.image.outputs.os }}-
      # A stuck package mirror once held this step for the whole job (45 min): fail fast, retry slow fetches.
      - name: Install Linux dependencies
        # The runner's mirror is sometimes slow (about a second a package): give it room, still failing fast on a real hang.
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # IPv4 only: the runner's mirror has hung on IPv6 several times (PRs #224, #229, #233, #238, #244).
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true"
          APT_UPDATE_START_SECONDS=$(date +%s)
          echo "APT_UPDATE_STARTED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sudo apt-get $APT update
          APT_UPDATE_ELAPSED_SECONDS=$(($(date +%s) - APT_UPDATE_START_SECONDS))
          echo "APT_UPDATE_FINISHED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ') elapsed_seconds=$APT_UPDATE_ELAPSED_SECONDS"
          # CI compiles/tests these apps but never runs their WebKit windows; skip
          # optional multimedia/runtime recommendations to keep mirror downloads bounded.
          # Kept packages first (see "Restore kept apt packages").
          if compgen -G "$HOME/apt-archives/*.deb" >/dev/null; then sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/; fi
          echo "APT_KEPT_PACKAGES=$(ls /var/cache/apt/archives/*.deb 2>/dev/null | wc -l)"
          APT_INSTALL_START_SECONDS=$(date +%s)
          echo "APT_INSTALL_STARTED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sudo apt-get $APT install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libasound2-dev libudev-dev patchelf cmake clang libclang-dev
          APT_INSTALL_ELAPSED_SECONDS=$(($(date +%s) - APT_INSTALL_START_SECONDS))
          echo "APT_INSTALL_FINISHED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ') elapsed_seconds=$APT_INSTALL_ELAPSED_SECONDS"
      # Also after a timeout: what the slow mirror did deliver is kept, so a cold cache fills over runs
      # instead of timing out the same way each time. Packages the index no longer lists are dropped
      # (autoclean), and nothing is saved when the set did not change. The job's result is untouched.
      - name: Collect apt packages for the next run
        id: apt-keep
        if: always() && steps.image.outcome == 'success'
        run: |
          timeout 120 sudo apt-get -qq autoclean || true
          new=$(cd /var/cache/apt/archives && ls -- *.deb 2>/dev/null | sort || true)
          old=$(cd "$HOME/apt-archives" 2>/dev/null && ls -- *.deb 2>/dev/null | sort || true)
          echo "APT_COLLECTED_PACKAGES=$(printf '%s' "$new" | grep -c . || true)"
          if [ -n "$new" ] && [ "$new" != "$old" ]; then
            rm -rf "$HOME/apt-archives" && mkdir -p "$HOME/apt-archives"
            cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep apt packages for the next run
        if: always() && steps.apt-keep.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ steps.image.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Placeholder bundled resources (tauri-build only checks they exist; CI never packages)
        run: |
          mkdir -p data
          [ -f data/rhema.db ] || : > data/rhema.db
      - name: Content crate tests
        working-directory: src-tauri
        run: |
          if [ -d crates/content ]; then cargo test -p rhema-content; else echo "no content crate on this branch"; fi
      - name: API crate tests, with the real camera router
        working-directory: src-tauri
        env:
          RHEMA_REQUIRE_ROUTER: "1"
        run: |
          ../scripts/fetch-mediamtx.sh x86_64-unknown-linux-gnu
          RHEMA_MEDIAMTX="$PWD/binaries/mediamtx-x86_64-unknown-linux-gnu" cargo test -p rhema-api
      - name: Content crate clippy (strict)
        working-directory: src-tauri
        run: |
          if [ -d crates/content ]; then cargo clippy -p rhema-content --all-targets -- -D warnings; else echo "no content crate on this branch"; fi
      - name: App crate check
        working-directory: src-tauri
        run: cargo check -p rhema
      - name: MCP design drafts end to end (the real `Rhema --mcp` over stdio, #443)
        working-directory: src-tauri
        run: cargo test -p rhema --test mcp_design_drafts
      - name: Dependency licences (Rust crates)
        run: bun scripts/check-licenses.ts --rust
      - name: App crate clippy (pre-existing warnings allowed, errors not)
        working-directory: src-tauri
        run: cargo clippy -p rhema

  companion:
    # Rhema Studio Companion (#209): the small app for an OBS computer, and the crate it shares with the
    # studio. Checked and tested here on Linux; nothing is bundled or published. There is no
    # Windows runner in CI: its Windows-only code (tray, start with the computer) is compile-checked
    # only by building it on a Windows computer (companion-app/README.md).
    name: Rhema Studio Companion (shared crate tests, app tests, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The packages this job installs, kept between runs (#604 follow-up): the runner's mirror has
      # trickled one package for minutes at a time and timed the step out (4 Nov, runs 41860147604,
      # 41882278283 and 41898262614). apt still checks every kept file against the signed index and fetches what is
      # missing or changed, so nothing is trusted that was not before; only the download is saved.
      - name: Runner image (the kept packages are per image)
        id: image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore kept apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ steps.image.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-${{ github.job }}-${{ steps.image.outputs.version }}-
            apt-${{ github.job }}-${{ steps.image.outputs.os }}-
      - name: Install Linux dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true"
          APT_UPDATE_START_SECONDS=$(date +%s)
          echo "APT_UPDATE_STARTED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sudo apt-get $APT update
          APT_UPDATE_ELAPSED_SECONDS=$(($(date +%s) - APT_UPDATE_START_SECONDS))
          echo "APT_UPDATE_FINISHED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ') elapsed_seconds=$APT_UPDATE_ELAPSED_SECONDS"
          # CI compiles/tests the companion but never launches its WebKit window.
          # Kept packages first (see "Restore kept apt packages").
          if compgen -G "$HOME/apt-archives/*.deb" >/dev/null; then sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/; fi
          echo "APT_KEPT_PACKAGES=$(ls /var/cache/apt/archives/*.deb 2>/dev/null | wc -l)"
          APT_INSTALL_START_SECONDS=$(date +%s)
          echo "APT_INSTALL_STARTED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sudo apt-get $APT install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev libdbus-1-dev
          APT_INSTALL_ELAPSED_SECONDS=$(($(date +%s) - APT_INSTALL_START_SECONDS))
          echo "APT_INSTALL_FINISHED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ') elapsed_seconds=$APT_INSTALL_ELAPSED_SECONDS"
      # Also after a timeout: what the slow mirror did deliver is kept, so a cold cache fills over runs
      # instead of timing out the same way each time. Packages the index no longer lists are dropped
      # (autoclean), and nothing is saved when the set did not change. The job's result is untouched.
      - name: Collect apt packages for the next run
        id: apt-keep
        if: always() && steps.image.outcome == 'success'
        run: |
          timeout 120 sudo apt-get -qq autoclean || true
          new=$(cd /var/cache/apt/archives && ls -- *.deb 2>/dev/null | sort || true)
          old=$(cd "$HOME/apt-archives" 2>/dev/null && ls -- *.deb 2>/dev/null | sort || true)
          echo "APT_COLLECTED_PACKAGES=$(printf '%s' "$new" | grep -c . || true)"
          if [ -n "$new" ] && [ "$new" != "$old" ]; then
            rm -rf "$HOME/apt-archives" && mkdir -p "$HOME/apt-archives"
            cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep apt packages for the next run
        if: always() && steps.apt-keep.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ steps.image.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri
            ./companion-app/src-tauri
      - name: Shared crate tests (rhema-join, with the companion's pinning and keychain)
        working-directory: src-tauri
        run: cargo test -p rhema-join --features pinned,keychain
      - name: Shared crate clippy (strict; its tests use rhema-api, which has warnings of its own)
        working-directory: src-tauri
        run: cargo clippy -p rhema-join --features pinned,keychain -- -D warnings
      - name: Companion page placeholder (tauri-build checks the folder exists; CI never packages)
        run: mkdir -p companion-app/build
      - name: Companion app tests
        working-directory: companion-app/src-tauri
        run: cargo test
      - name: Companion app clippy (strict)
        working-directory: companion-app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  companion-packaging:
    name: Companion package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI builds only for the church's Intel Mac (owner, 2 Nov 2026); other platforms when the owner names them.
          - os: macos-15-intel
            platform: macOS Intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./companion-app/src-tauri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the native Companion bundle
        run: bun run companion:build -- --target ${{ matrix.target }}

  # Windows packaging is a full Tauri bundle with whisper.cpp and LLVM, which
  # takes far longer than a PR check should. It stays manual:
  # Actions → "Build Windows Installer" → Run workflow. A PR is not "Windows
  # verified" unless that run is linked in the PR.
