name: CI

# Runs on every pull request and on pushes to feature branches. Release
# release packaging stays in build-release.yml (tags) and build-windows-installer.yml
# (manual). Companion packaging below is a compile/bundle smoke check only: it uploads and signs nothing.
on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "pr/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (tsc -b; the root tsconfig has no files, so plain `tsc --noEmit` checks nothing)
        run: bunx tsc -b --noEmit
      - name: Unit tests
        run: bunx vitest run
      - name: Dependency licences (npm production tree)
        run: bun scripts/check-licenses.ts --js
      - name: Production build (tsc -b && vite build)
        run: bun run build
      - name: Rhema Studio Companion page build (its own Vite entry, #209)
        run: bun run companion:web

  lint:
    # The whole repository lints clean (ST-010); any new error fails the job.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: ESLint (whole repo, blocking; the upstream debt was paid down in ST-010)
        run: bunx eslint .

  rust:
    name: Rust (content tests, app check, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # A stuck package mirror once held this step for the whole job (45 min): fail fast, retry slow fetches.
      - name: Install Linux dependencies
        # The runner's mirror is sometimes slow (about a second a package): give it room, still failing fast on a real hang.
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # IPv4 only: the runner's mirror has hung on IPv6 several times (PRs #224, #229, #233, #238, #244).
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true"
          sudo apt-get $APT update
          sudo apt-get $APT install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libasound2-dev libudev-dev patchelf cmake clang libclang-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Placeholder bundled resources (tauri-build only checks they exist; CI never packages)
        run: |
          mkdir -p data
          [ -f data/rhema.db ] || : > data/rhema.db
      - name: Content crate tests
        working-directory: src-tauri
        run: |
          if [ -d crates/content ]; then cargo test -p rhema-content; else echo "no content crate on this branch"; fi
      - name: Content crate clippy (strict)
        working-directory: src-tauri
        run: |
          if [ -d crates/content ]; then cargo clippy -p rhema-content --all-targets -- -D warnings; else echo "no content crate on this branch"; fi
      - name: App crate check
        working-directory: src-tauri
        run: cargo check -p rhema
      - name: Dependency licences (Rust crates)
        run: bun scripts/check-licenses.ts --rust
      - name: App crate clippy (pre-existing warnings allowed, errors not)
        working-directory: src-tauri
        run: cargo clippy -p rhema

  companion:
    # Rhema Studio Companion (#209): the small app for an OBS computer, and the crate it shares with the
    # studio. Linux runs shared-crate tests and app clippy; companion-packaging below builds native
    # macOS and Windows bundles without publishing them.
    name: Rhema Studio Companion (shared crate tests, app tests, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev libdbus-1-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri
            ./companion-app/src-tauri
      - name: Shared crate tests (rhema-join, with the companion's pinning and keychain)
        working-directory: src-tauri
        run: cargo test -p rhema-join --features pinned,keychain
      - name: Shared crate clippy (strict; its tests use rhema-api, which has warnings of its own)
        working-directory: src-tauri
        run: cargo clippy -p rhema-join --features pinned,keychain -- -D warnings
      - name: Companion page placeholder (tauri-build checks the folder exists; CI never packages)
        run: mkdir -p companion-app/build
      - name: Companion app tests
        working-directory: companion-app/src-tauri
        run: cargo test
      - name: Companion app clippy (strict)
        working-directory: companion-app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  companion-packaging:
    name: Companion package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS Apple Silicon
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: Windows x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./companion-app/src-tauri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the native Companion bundle
        run: bun run companion:build -- --target ${{ matrix.target }}

  # Windows packaging is a full Tauri bundle with whisper.cpp and LLVM, which
  # takes far longer than a PR check should. It stays manual:
  # Actions → "Build Windows Installer" → Run workflow. A PR is not "Windows
  # verified" unless that run is linked in the PR.
