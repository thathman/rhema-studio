name: CI

# Runs on every pull request and on pushes to feature branches. Release
# packaging stays in build-release.yml (tags) and build-windows-installer.yml
# (manual); this workflow never produces artifacts and never signs anything.
on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "pr/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bunx vitest run
      - name: Production build
        run: bunx vite build

  lint:
    # Pre-existing ESLint debt lives mostly in web/, src-tauri data scripts and
    # a few upstream panels (see docs/rhema-studio/01-existing-system-audit.md).
    # Rhema Studio code and the stores must stay clean; the full run is
    # reported but does not block until the debt is paid down.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: ESLint (Rhema Studio code, blocking)
        run: |
          paths=""
          for p in src/studio src/stores src/hooks/use-detection-events.ts src/types src/App.tsx; do
            [ -e "$p" ] && paths="$paths $p"
          done
          echo "Linting:$paths"
          bunx eslint $paths
      - name: ESLint (whole repo, informational)
        continue-on-error: true
        run: bunx eslint .

  rust:
    name: Rust (content tests, app check, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libasound2-dev libudev-dev patchelf cmake clang libclang-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Placeholder bundled resources (tauri-build only checks they exist; CI never packages)
        run: |
          mkdir -p data models/whisper
          [ -f data/rhema.db ] || : > data/rhema.db
      - name: Content crate tests
        working-directory: src-tauri
        run: |
          if [ -d crates/content ]; then cargo test -p rhema-content; else echo "no content crate on this branch"; fi
      - name: Content crate clippy (strict)
        working-directory: src-tauri
        run: |
          if [ -d crates/content ]; then cargo clippy -p rhema-content --all-targets -- -D warnings; else echo "no content crate on this branch"; fi
      - name: App crate check
        working-directory: src-tauri
        run: cargo check -p rhema
      - name: App crate clippy (pre-existing warnings allowed, errors not)
        working-directory: src-tauri
        run: cargo clippy -p rhema

  # Windows packaging is a full Tauri bundle with whisper.cpp and LLVM, which
  # takes far longer than a PR check should. It stays manual:
  # Actions → "Build Windows Installer" → Run workflow. A PR is not "Windows
  # verified" unless that run is linked in the PR.
