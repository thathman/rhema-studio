# The inherited OpenBezal web/ app is preserved for historical documentation.
# It is no longer the Rhema Studio public site and MUST NOT publish to Pages.
# The current branded site is site/ and the only deployment path is
# .github/workflows/deploy-rhema-site.yml.
name: Legacy web — build check only

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-legacy-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
