name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM for bindgen
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            choco install llvm --yes --no-progress
          }
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            throw "LLVM/libclang.dll was not found at $llvmBin"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare bundled Bible database
        run: |
          bun run data/download-sources.ts
          bun run data/build-bible-db.ts

      - name: Third-party notices (licence check + every package's licence text)
        run: bun scripts/check-licenses.ts --notices data/THIRD-PARTY-NOTICES.md

      - name: Download bundled Whisper model
        run: bun run download:whisper

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rhema-windows-x64-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
