<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/01_Master_Mark/Rhema-Studio-Master-Mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhema Studio</title>
    <!-- While the studio loads: the mark and the name, on the light or dark page colour. React replaces it. -->
    <style>
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f5f4ef;color:#1d2a30;font:600 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-0.01em}
      #boot img{width:64px;height:64px}
      #boot .on-dark{display:none}
      @media (prefers-color-scheme: dark){#boot{background:#121c22;color:#eef3f1}#boot .on-light{display:none}#boot .on-dark{display:block}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status" aria-label="Rhema Studio is starting"><img class="on-light" src="/brand/01_Master_Mark/Rhema-Studio-Master-Mark.svg" alt="" /><img class="on-dark" src="/brand/01_Master_Mark/Rhema-Studio-Mark-Light.svg" alt="" /><span>Rhema Studio</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
