[package]
name = "rhema-join"
version = "0.1.0"
edition = "2021"
description = "Joining a Rhema host on the church network (find it, pair, follow it), shared by Rhema and Rhema Companion"

[lints]
workspace = true

[features]
default = []
# Rhema Companion (#209): https to the host, its certificate pinned at pairing (rustls with ring:
# no OpenSSL, builds with the MSVC toolchain on Windows).
pinned = ["dep:rustls", "dep:sha2", "reqwest/rustls-tls-manual-roots"]
# Saved keys and passwords in the system's credential store (RG-08).
keychain = ["dep:keyring"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
# Plain http to a host by default (Rhema); `pinned` adds https.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
# Find hosts on the LAN (mDNS, pure Rust, MIT/Apache-2.0).
mdns-sd = { version = "0.21", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
sha2 = { version = "0.10", optional = true }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
# The host's real certificates (its local CA and https certificate), for the pinning tests.
rhema-api = { path = "../api" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
